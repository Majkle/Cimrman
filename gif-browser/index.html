<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cimrman GIF Browser</title>
    <link rel="icon" href="https://97948f068d.cbaul-cdnwnd.com/c7949d5abdfc4c8444516baa21a98778/200000790-057ee057f0/4-39.jpg?ph=97948f068d" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <div class="title-row">
        <img
          class="logo"
          src="https://97948f068d.cbaul-cdnwnd.com/c7949d5abdfc4c8444516baa21a98778/200000790-057ee057f0/4-39.jpg?ph=97948f068d"
          alt="Jára Cimrman"
          width="40"
          height="40"
        />
        <h1>Cimrman GIF Browser</h1>
        <button
          id="filters-toggle"
          class="filters-toggle"
          type="button"
          aria-expanded="true"
          aria-controls="filters-row"
          hidden
        >
          Filtry
        </button>
        <div id="stats">Načítám...</div>
      </div>
      <div id="filters-row" class="filters-row">
        <input
          id="search"
          class="filter-control"
          type="search"
          placeholder="Hledat"
          autocomplete="off"
          spellcheck="false"
        />
        <div id="play-filter" class="multiselect"></div>
        <div id="actor-filter" class="multiselect"></div>
      </div>
    </header>

    <main>
      <div id="grid" aria-live="polite"></div>
      <div id="status" class="status" hidden></div>
    </main>

    <div id="toast" role="status" aria-live="polite"></div>

    <script src="./app.js" type="module"></script>
  </body>
</html>
