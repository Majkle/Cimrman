<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cimrman GIF Browser</title>
    <link
      rel="icon"
      href="https://97948f068d.cbaul-cdnwnd.com/c7949d5abdfc4c8444516baa21a98778/200000790-057ee057f0/4-39.jpg?ph=97948f068d"
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #111;
        --panel: #1b1b1b;
        --text: #f2f2f2;
        --muted: #9a9a9a;
        --accent: #f5c542;
        --border: #2f2f2f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      header {
        position: sticky;
        top: 0;
        z-index: 2;
        background: color-mix(in srgb, var(--bg) 92%, transparent);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border);
        padding: 1rem;
      }

      .title-row {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 0.75rem;
      }

      .logo {
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 0.45rem;
        object-fit: cover;
        flex-shrink: 0;
        border: 1px solid var(--border);
      }

      h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 600;
      }

      .search-row {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        flex-wrap: wrap;
      }

      #search {
        flex: 1 1 16rem;
        min-width: 12rem;
        padding: 0.65rem 0.8rem;
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        background: var(--panel);
        color: var(--text);
        font-size: 1rem;
      }

      #search:focus {
        outline: 2px solid var(--accent);
        border-color: transparent;
      }

      #stats {
        color: var(--muted);
        font-size: 0.9rem;
        white-space: nowrap;
      }

      #toast {
        position: fixed;
        left: 50%;
        bottom: 1.25rem;
        transform: translateX(-50%) translateY(120%);
        background: #222;
        color: var(--text);
        border: 1px solid var(--border);
        padding: 0.6rem 1rem;
        border-radius: 999px;
        opacity: 0;
        transition: transform 0.2s ease, opacity 0.2s ease;
        pointer-events: none;
        z-index: 10;
      }

      #toast.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }

      main {
        padding: 1rem;
      }

      #grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 1rem;
      }

      .card {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        padding: 0.5rem;
      }

      .gif-wrap {
        position: relative;
        aspect-ratio: 1;
        border-radius: 0.5rem;
        overflow: hidden;
        background: #000;
        cursor: copy;
        border: none;
        padding: 0;
        width: 100%;
      }

      .gif-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .gif-wrap:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .meta-row {
        display: flex;
        align-items: flex-start;
        gap: 0.5rem;
      }

      .meta {
        flex: 1;
        font-size: 0.78rem;
        color: var(--muted);
        line-height: 1.35;
        min-height: 2.7em;
        overflow: hidden;
      }

      .play-btn {
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2rem;
        height: 2rem;
        border: 1px solid var(--border);
        background: #242424;
        color: var(--text);
        border-radius: 0.45rem;
        padding: 0;
        cursor: pointer;
      }

      .play-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .play-btn svg {
        width: 1rem;
        height: 1rem;
        fill: currentColor;
      }

      .status {
        padding: 2rem 1rem;
        text-align: center;
        color: var(--muted);
      }

      @media (max-width: 480px) {
        #grid {
          grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="title-row">
        <img
          class="logo"
          src="https://97948f068d.cbaul-cdnwnd.com/c7949d5abdfc4c8444516baa21a98778/200000790-057ee057f0/4-39.jpg?ph=97948f068d"
          alt="Jára Cimrman"
          width="40"
          height="40"
        />
        <h1>Cimrman GIF Browser</h1>
      </div>
      <div class="search-row">
        <input
          id="search"
          type="search"
          placeholder="Hledat v tags / texts (částečná shoda)..."
          autocomplete="off"
          spellcheck="false"
        />
        <div id="stats">Načítám...</div>
      </div>
    </header>

    <main>
      <div id="grid" aria-live="polite"></div>
      <div id="status" class="status" hidden></div>
    </main>

    <div id="toast" role="status" aria-live="polite"></div>

    <script src="./app.js" type="module"></script>
  </body>
</html>
